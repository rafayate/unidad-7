
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Abastecimiento de por Vida</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Calculadora de Abastecimiento de por Vida</h1>

    <section>
        <h2>🍟 Ejercicio 1: El cálculo de los snacks</h2>
        <p>Calculá cuántos snacks vas a comer durante el resto de tu vida.</p>
        <button onclick="calcularSnacks()">Calcular snacks</button>
    </section>

    <section>
        <h2>✈️ Ejercicio 2: Presupuesto de viaje</h2>
        <p>Calculá cuánto podés gastar en cada comida durante tu viaje.</p>
        <button onclick="calcularViaje()">Calcular presupuesto</button>
    </section>

    <script src="script.js"></script>
</body>
</html>
